[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "python-price-drop-alerts"
version = "1.0.0"
description = "Price-drop and back-in-stock email alerts that run on GitHub Actions and send via Mailtrap."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "selectolax>=1.0,<2",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "mailtrap>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
price-alerts = "price_alerts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
