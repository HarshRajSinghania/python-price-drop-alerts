<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Price Drop and Back-in-Stock Email Alerts</title>
  <desc id="d">A product price falling from 249.00 to 199.00 and an alert email, sent from GitHub Actions with Mailtrap</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14254a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="104" fill="#93c5fd" font-size="20" font-weight="600" letter-spacing="2">PYTHON · GITHUB ACTIONS · MAILTRAP</text>
    <text x="64" y="160" fill="#ffffff" font-size="46" font-weight="700">Price Drop &amp; Back-in-Stock</text>
    <text x="64" y="214" fill="#ffffff" font-size="46" font-weight="700">Email Alerts</text>
    <text x="64" y="262" fill="#cbd5e1" font-size="22">One YAML file. No server. One email per event.</text>

    <!-- price chart -->
    <g transform="translate(760 60)">
      <rect width="456" height="200" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <line x1="28" y1="128" x2="428" y2="128" stroke="#f87171" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="28" y="152" fill="#fca5a5" font-size="15">target 200.00</text>
      <polyline points="28,70 98,64 168,76 238,60 308,72 360,150 428,156" fill="none" stroke="url(#line)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="360" cy="150" r="7" fill="#34d399"/>
      <text x="28" y="44" fill="#e2e8f0" font-size="18" font-weight="600">249.00 → 199.00</text>
      <rect x="176" y="27" width="70" height="24" rx="12" fill="#34d399" fill-opacity="0.18"/>
      <text x="211" y="44" fill="#6ee7b7" font-size="15" font-weight="700" text-anchor="middle">-20%</text>
      <!-- envelope -->
      <g transform="translate(300 18)">
        <rect width="112" height="40" rx="8" fill="#2563eb"/>
        <path d="M14 12 L30 24 L46 12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="80" y="26" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Alert</text>
      </g>
    </g>
  </g>
</svg>
